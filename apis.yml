name: SpringRole
description: >-
  SpringRole was a blockchain-based professional reputation and attestation
  platform — an endorsement and verified-resume network that let people attest
  to each other's skills and work history on-chain — and was a portfolio company
  of Bloomberg Beta. Its primary domain, springrole.com, now issues a 301
  redirect to Springworks (springworks.in), an HR-technology company whose
  products include SpringVerify (background verification), Goodfit (AI-native
  recruitment), and EngageWith (employee engagement). An enrichment pass on
  2026-07-21 found no public developer API, OpenAPI/AsyncAPI specification,
  developer portal, SDK/package, MCP server, llms.txt, or /.well-known discovery
  documents for SpringRole (the well-known paths return the Webflow marketing
  SPA, not real artifacts), and no separate developer or docs subdomain resolves.
